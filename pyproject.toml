[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-pe-lof-qc"
version = "2.0.0"
description = "Physics-Embedded Local Outlier Factor (PE-LOF) for Oceanographic Quality Control"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Oceanographic AI Research Team" }]
keywords = ["oceanography", "quality-control", "anomaly-detection", "local-outlier-factor", "argo", "woce", "woa23"]

dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "netCDF4>=1.6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.0", "flake8>=6.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
