name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all stylistic warnings as non-fatal
        flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Generate synthetic benchmark data
      env:
        PYTHONPATH: .
      run: |
        python -m src.data_generator --profiles 20 --output tests/fixtures/synthetic_argo.csv

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v
